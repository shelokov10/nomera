<style>
/* ================= \442 \43e \43a \435 \43d \44b  ================= */
:root{
  --bg:#000;--card:#1c1c1e;--card2:#2c2c2e;--card3:#3a3a3c;--elev:#1c1c1e;
  --text:#fff;--text2:rgba(235,235,245,.62);--text3:rgba(235,235,245,.32);--sep:rgba(84,84,88,.55);
  --fill:rgba(118,118,128,.24);--fill2:rgba(118,118,128,.16);--fill3:rgba(118,118,128,.12);
  --glass:rgba(36,36,38,.58);--glass-strong:rgba(44,44,46,.78);--glass-b:rgba(255,255,255,.13);--glass-hi:rgba(255,255,255,.16);--glass-sh:0 10px 34px rgba(0,0,0,.45);
  --pill:rgba(255,255,255,.22);--pill-h:rgba(255,255,255,.3);
  --accent:#ff8a00;--accent2:#ffb340;--on-accent:#fff;
  --blue:#0a84ff;--green:#30d158;--red:#ff453a;--yellow:#ffd60a;--purple:#bf5af2;--teal:#40c8e0;--indigo:#5e5ce6;--pink:#ff375f;--orange:#ff9f0a;--mint:#63e6be;
  --gold:#ffc83d;--stars:#ffb800;
  --r-xl:28px;--r-lg:22px;--r-md:18px;--r-sm:13px;
  --g:16px;
  --f-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue","Segoe UI",Roboto,Arial,sans-serif;
  --f-plate:"Roboto Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --safe-t:max(env(safe-area-inset-top),var(--tg-content-safe-area-inset-top,0px));
  --safe-b:env(safe-area-inset-bottom);
  --tabh:64px;
  --sky1:#0d1b33;--sky2:#2b4a78;--hill1:#16243a;--hill2:#1d3150;--ground:#1b222c;--ground-top:#5d6b80;--road:#e9edf2;
}
:root[data-theme="light"]{
  --bg:#f2f2f7;--card:#fff;--card2:#f2f2f7;--card3:#e5e5ea;--elev:#fff;
  --text:#000;--text2:rgba(60,60,67,.62);--text3:rgba(60,60,67,.3);--sep:rgba(60,60,67,.18);
  --fill:rgba(120,120,128,.2);--fill2:rgba(120,120,128,.14);--fill3:rgba(118,118,128,.1);
  --glass:rgba(255,255,255,.62);--glass-strong:rgba(255,255,255,.86);--glass-b:rgba(0,0,0,.08);--glass-hi:rgba(255,255,255,.9);--glass-sh:0 10px 30px rgba(0,0,0,.14);
  --sky1:#7cc4ff;--sky2:#dff1ff;--hill1:#a9d38c;--hill2:#87bf6b;--ground:#6f8f55;--ground-top:#4e6b3a;--road:#ffffff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.35 var(--f-ui);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body{min-height:100vh;overflow-x:hidden;overscroll-behavior-y:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
img{display:block;max-width:100%}
.ic{width:20px;height:20px;flex:none;display:inline-block;vertical-align:middle}
.row .chev{width:18px;height:18px;color:var(--text3)}
a{color:var(--blue);text-decoration:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ================= \43a \430 \440 \43a \430 \441  ================= */
#app{max-width:560px;margin:0 auto;position:relative}
.view{padding:calc(var(--safe-t) + 10px) 0 calc(var(--tabh) + var(--safe-b) + 40px);min-height:100vh}
.tab{display:none}.tab.on{display:block}
.pad{padding-inline:var(--g)}
.top{display:flex;align-items:center;gap:12px;padding:6px var(--g) 2px}
.top h1{flex:1;margin:0;font:700 32px/1.12 var(--f-ui);letter-spacing:-.02em}
.ava{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;font:600 16px var(--f-ui);color:#fff;background:linear-gradient(160deg,#ffb25c,#ff6a00);overflow:hidden;position:relative}
.ava img{width:100%;height:100%;object-fit:cover}
.ava.lg{width:92px;height:92px;font-size:36px}
.ava.md{width:56px;height:56px;font-size:22px}
.ava.sm{width:30px;height:30px;font-size:13px}

/* \43a \43e \448 \435 \43b \451 \43a  */
.wallet{display:flex;gap:8px;padding:10px var(--g) 4px;overflow-x:auto;scrollbar-width:none}
.wallet::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:999px;background:var(--card);font:600 15px/1 var(--f-ui);white-space:nowrap;font-variant-numeric:tabular-nums;flex:none}
.chip .ic{width:17px;height:17px}
.chip.gold .ic{color:var(--gold)}.chip.key .ic{color:var(--teal)}
.chip.bump{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.08)}}

/* \437 \430 \433 \43e \43b \43e \432 \43a \438  \440 \430 \437 \434 \435 \43b \43e \432  */
.sec{display:flex;align-items:center;gap:4px;margin:30px var(--g) 12px;font:700 22px/1.2 var(--f-ui);letter-spacing:-.01em}
.sec .chev{width:20px;height:20px;color:var(--text3);margin-top:2px}
button.sec{width:calc(100% - 2*var(--g));text-align:left}
.sec small{font:500 15px var(--f-ui);color:var(--text2);margin-left:auto}
.sub{margin:-6px var(--g) 12px;color:var(--text2);font-size:15px}

/* ================= \43f \430 \43d \435 \43b \44c  \432 \43a \43b \430 \434 \43e \43a  (\436 \438 \434 \43a \43e \435  \441 \442 \435 \43a \43b \43e ) ================= */
#dock{position:fixed;z-index:40;left:0;right:0;bottom:calc(var(--safe-b) + 10px);display:flex;justify-content:center;pointer-events:none}
#dock .inner{width:min(560px,100%);display:flex;gap:10px;padding:0 12px;pointer-events:auto}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(190%);backdrop-filter:blur(26px) saturate(190%);border:.5px solid var(--glass-b);box-shadow:var(--glass-sh),inset 0 1px 0 var(--glass-hi)}
#tabs{flex:1;height:var(--tabh);border-radius:999px;display:flex;padding:4px;position:relative}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:999px;font:600 10px/1 var(--f-ui);color:var(--text);position:relative;z-index:1;transition:transform .15s}
#tabs button:active{transform:scale(.92)}
#tabs button .ic{width:25px;height:25px}
#tabs .lens{position:absolute;top:4px;bottom:4px;left:4px;border-radius:999px;background:var(--fill);transition:transform .38s cubic-bezier(.3,1.35,.5,1),width .3s;z-index:0;box-shadow:inset 0 1px 0 var(--glass-hi)}
#tabs button.on{color:var(--accent)}
#tabs .dot{position:absolute;top:6px;right:calc(50% - 18px);width:8px;height:8px;border-radius:50%;background:var(--red)}
#dock .round{width:var(--tabh);height:var(--tabh);border-radius:50%;flex:none;display:grid;place-items:center;transition:transform .15s;position:relative}
#dock .round:active{transform:scale(.92)}
#dock .round .ic{width:28px;height:28px;color:var(--gold)}
#dock .round.on{box-shadow:var(--glass-sh),inset 0 0 0 2px var(--gold)}
.fadebar{position:fixed;left:0;right:0;bottom:0;height:calc(var(--safe-b) + 92px);background:linear-gradient(to bottom,transparent,var(--bg) 78%);pointer-events:none;z-index:39}

/* ================= \43a \43d \43e \43f \43a \438  ================= */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 22px;border-radius:999px;font:600 17px/1 var(--f-ui);background:var(--fill);color:var(--text);transition:transform .12s,filter .12s,opacity .12s;white-space:nowrap;position:relative;user-select:none;-webkit-user-select:none}
.btn:active{transform:scale(.965);filter:brightness(1.15)}
.btn.pri{background:linear-gradient(180deg,#ffa53a,var(--accent));color:#fff;box-shadow:0 6px 18px rgba(255,138,0,.32),inset 0 1px 0 rgba(255,255,255,.35)}
.btn.white{background:#fff;color:#000}
:root[data-theme="light"] .btn.white{background:#000;color:#fff}
.btn.blue{background:var(--blue);color:#fff}
.btn.gold{background:linear-gradient(180deg,#ffd76a,#f0a800);color:#3a2600}
.btn.danger{color:var(--red)}
.btn.sm{height:34px;padding:0 15px;font-size:15px}
.btn.md{height:42px;padding:0 18px;font-size:16px}
.btn.wide{width:100%}
.btn[disabled],.btn.off{opacity:.42;pointer-events:none}
.btn.busy{pointer-events:none}
.btn.busy>*{opacity:0}
.btn.busy::after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 15px;border-radius:999px;background:var(--fill);font:600 15px/1 var(--f-ui);white-space:nowrap;transition:transform .12s;position:relative}
.pill:active{transform:scale(.95)}
.pill.on-card{background:var(--pill);color:#fff;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.pill.busy{pointer-events:none;color:transparent}
.pill.busy::after{content:"";position:absolute;width:15px;height:15px;border-radius:50%;border:2px solid var(--text);border-right-color:transparent;animation:spin .7s linear infinite}
.pill.on-card.busy::after{border-color:#fff;border-right-color:transparent}
.pill .ic{width:15px;height:15px}
.iconbtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--fill);flex:none;transition:transform .12s}
.iconbtn:active{transform:scale(.9)}
.iconbtn .ic{width:19px;height:19px}

/* \441 \435 \433 \43c \435 \43d \442 \44b  (\43a \430 \43a  \ab \412 \441 \435  \438 \433 \440 \44b  \b7  Arcade \b7  \41c \435 \434 \438 \430 \442 \435 \43a \430 \bb ) */
.seg{display:flex;gap:6px;padding:4px var(--g);overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{height:36px;padding:0 16px;border-radius:999px;font:600 15px/1 var(--f-ui);color:var(--text);white-space:nowrap;flex:none;transition:background .2s,color .2s}
.seg button.on{background:var(--text);color:var(--bg)}
.seg.tight{padding-inline:0}
.segbox{display:flex;background:var(--fill2);border-radius:999px;padding:3px;gap:2px}
.segbox button{flex:1;height:34px;border-radius:999px;font:600 14px/1 var(--f-ui);color:var(--text2);transition:background .2s,color .2s;white-space:nowrap;padding:0 8px}
.segbox button.on{background:var(--card3);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.18)}
:root[data-theme="light"] .segbox button.on{background:#fff}

/* ================= \43a \430 \440 \442 \43e \447 \43a \438  ================= */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 var(--g)}
.shelf{display:flex;gap:12px;overflow-x:auto;padding:0 var(--g) 4px;scroll-snap-type:x mandatory;scroll-padding:var(--g);scrollbar-width:none}
.shelf::-webkit-scrollbar{display:none}
.shelf>*{scroll-snap-align:start;flex:none}
.gc{position:relative;border-radius:var(--r-lg);overflow:hidden;color:#fff;background:var(--gc,linear-gradient(180deg,#4a5360,#262b33));display:flex;flex-direction:column;justify-content:flex-end;padding:14px;min-height:0;isolation:isolate;transition:transform .15s}
.gc:active{transform:scale(.98)}
.gc .t{font:600 17px/1.2 var(--f-ui);letter-spacing:-.01em}
.gc .s{font:500 14px/1.25 var(--f-ui);color:var(--tint,rgba(255,255,255,.72));margin-top:2px}
.gc .k{font:500 13px/1.2 var(--f-ui);color:var(--tint,rgba(255,255,255,.72))}
.gc .act{margin-top:12px;display:flex;gap:8px;align-items:center}
.gc .big{position:absolute;left:14px;top:4px;font:800 120px/1 var(--f-ui);letter-spacing:-.06em;color:var(--num,rgba(255,255,255,.35));z-index:-1}
.gc .art{position:absolute;right:10px;top:22px;z-index:-1}
.top4 .gc{aspect-ratio:.72}
.g-orange{--gc:linear-gradient(180deg,#ffb21f 0%,#ff9500 55%,#f07c00 100%);--num:#ffe14d;--tint:#ffe7a8}
.g-blue{--gc:linear-gradient(180deg,#1689ff 0%,#0866e0 55%,#0a4fb8 100%);--num:#55b6ff;--tint:#a9d6ff}
.g-green{--gc:linear-gradient(180deg,#44c548 0%,#2a9a2e 60%,#1c7a22 100%);--num:#7fe26a;--tint:#c7f5b8}
.g-grey{--gc:linear-gradient(180deg,#3e4650 0%,#2c323a 60%,#22272e 100%);--num:#5d6a78;--tint:#b7c2cd}
.g-red{--gc:linear-gradient(180deg,#ff5145 0%,#e0302a 55%,#b51f1a 100%);--num:#ff8e7a;--tint:#ffc2b8}
.g-purple{--gc:linear-gradient(180deg,#a64dff 0%,#7a2fe0 55%,#5a1fb0 100%);--num:#c88bff;--tint:#e1c4ff}
.g-teal{--gc:linear-gradient(180deg,#1fc8d6 0%,#0d9fb0 55%,#0a7f8f 100%);--num:#6fe6ef;--tint:#bff5f8}
.g-indigo{--gc:linear-gradient(180deg,#6a67ff 0%,#4744e0 55%,#3330b0 100%);--num:#9b99ff;--tint:#d0cfff}
.g-yellow{--gc:linear-gradient(180deg,#ffd426 0%,#f5b800 60%,#d99a00 100%);--num:#fff07a;--tint:#fff3c0}
.g-pink{--gc:linear-gradient(180deg,#ff4f8a 0%,#e02d6a 60%,#b51d52 100%);--num:#ff9cbf;--tint:#ffd0e0}
.g-wine{--gc:linear-gradient(180deg,#8e2b3a 0%,#6b1d2a 60%,#4f1520 100%);--num:#c25366;--tint:#f0b7c0}
.g-dark{--gc:linear-gradient(180deg,#2c2c2e,#1c1c1e);--num:#48484a;--tint:var(--text2)}
:root[data-theme="light"] .g-dark{--gc:linear-gradient(180deg,#fff,#f4f4f6);color:#000}
.card{background:var(--card);border-radius:var(--r-lg);margin:0 var(--g)}
.card.p{padding:16px}
.card+.card{margin-top:10px}

/* \441 \442 \440 \43e \43a \438  \441 \43f \438 \441 \43a \430  \43a \430 \43a  \432  Apple Games */
.rows{display:grid;gap:10px;padding:0 var(--g)}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:var(--r-md);padding:12px 14px;min-height:72px;text-align:left;width:100%;position:relative}
button.row:active,.row.tap:active{filter:brightness(1.18)}
.row .ico{width:52px;height:52px;border-radius:13px;flex:none;display:grid;place-items:center;overflow:hidden;color:#fff}
.row .ico .ic{width:28px;height:28px}
.row .mid{flex:1;min-width:0}
.row .tt{font:600 17px/1.2 var(--f-ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .ss{font:400 14px/1.25 var(--f-ui);color:var(--text2);margin-top:2px;overflow:hidden;text-overflow:ellipsis}
.row .ey{font:500 13px/1.2 var(--f-ui);color:var(--text2)}
.row .end{flex:none;display:flex;align-items:center;gap:8px}
.row .val{font:600 16px var(--f-ui);font-variant-numeric:tabular-nums;white-space:nowrap}
.row .plate{width:112px;flex:none}
.group{background:var(--card);border-radius:var(--r-md);margin:0 var(--g);overflow:hidden}
.group .li{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:52px;width:100%;text-align:left;position:relative}
.group .li+.li::before{content:"";position:absolute;top:0;left:56px;right:0;border-top:.5px solid var(--sep)}
.group .li.noic+.li::before,.group .li.noic::before{left:16px}
.group .li .lic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none}
.group .li .lic .ic{width:18px;height:18px}
.group .li .lt{flex:1;font-size:17px}
.group .li .lv{color:var(--text2);font-size:16px;margin-left:auto;text-align:right;padding-left:10px}
.li .lt{min-width:0}
.li .lv.num{white-space:nowrap}
.group button.li{text-align:left}
.group .li .chev{width:16px;height:16px;color:var(--text3)}
button.li:active{background:var(--fill3)}
.note{margin:8px calc(var(--g) + 16px) 0;font-size:13px;color:var(--text2);line-height:1.4}

/* ================= \43b \435 \43d \442 \44b  \438  \43f \440 \43e \433 \440 \435 \441 \441  ================= */
.bar{height:8px;border-radius:99px;background:var(--fill);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#ffb340,var(--accent));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar.on-card{background:rgba(255,255,255,.25)}.bar.on-card i{background:#fff}
.badge{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;font:600 12px/1 var(--f-ui);background:var(--fill);white-space:nowrap}
.badge .ic{width:12px;height:12px}
.b-plus{background:linear-gradient(180deg,#ffd76a,#f0a800);color:#3a2600}
.b-prem{background:linear-gradient(180deg,#b86bff,#7a2fe0);color:#fff}
.b-adm{background:var(--blue);color:#fff}
.b-own{background:var(--red);color:#fff}
.b-title{background:var(--fill);color:var(--text)}
.muted{color:var(--text2)}
.num{font-variant-numeric:tabular-nums}
.empty{margin:0 var(--g);padding:28px 18px;border-radius:var(--r-lg);background:var(--card);text-align:center;color:var(--text2);display:grid;gap:12px;justify-items:center}
.dots{display:flex;justify-content:center;gap:7px;margin-top:12px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--text3);transition:width .25s,background .25s}
.dots i.on{width:22px;border-radius:99px;background:var(--text)}

/* ================= \43d \43e \43c \435 \440 \430  ================= */
.plate{container-type:inline-size;width:100%;aspect-ratio:4.65/1;position:relative;--pw:500;font-family:var(--f-plate)}
.plate.us{aspect-ratio:2/1;width:52%;margin-inline:auto}
.pb{position:absolute;inset:0;display:flex;background:#fff;color:#111;border:.7cqw solid #111;border-radius:2.6cqw;overflow:hidden;font-weight:var(--pw);box-shadow:inset 0 0 0 .55cqw #fff,0 .8cqw 2cqw rgba(0,0,0,.25)}
.pm{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;font-size:18cqw;line-height:1;letter-spacing:.01em;white-space:nowrap;gap:1.4cqw;padding-top:1cqw;position:relative;z-index:2}
.pm .dg{margin-inline:1cqw;font-size:1.08em}
.pr{width:23cqw;border-left:.7cqw solid currentColor;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6cqw;position:relative;z-index:2}
.rn{font-size:15cqw;line-height:.95}
.rn.n3{font-size:12.6cqw}
.rc{display:flex;align-items:center;gap:1cqw;font:700 4.4cqw/1 var(--f-plate);letter-spacing:.06em}
.ps{width:11.5cqw;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4cqw;color:#fff;font:700 4.8cqw/1 var(--f-plate);letter-spacing:.04em;position:relative;z-index:2}
.ps.ua,.ps.kz,.ps.eu{background:#0b46b0}.ps.kz{background:#0a6bb8}.ps.eu{background:#0b3fa8}
.ps.eu b{font-size:6.4cqw}
.stars12{width:7.5cqw;height:7.5cqw}
.fl{display:inline-block;flex:none;width:6.4cqw;height:4.2cqw;box-shadow:0 0 0 .25cqw rgba(0,0,0,.35)}
.ps .fl{box-shadow:none}
.fru{background:linear-gradient(#fff 0 33.4%,#0039a6 33.4% 66.7%,#d52b1e 66.7%)}
.fua{background:linear-gradient(#0057b7 0 50%,#ffd700 50%)}
.fkz{background:radial-gradient(circle at 50% 50%,#fec50c 0 22%,transparent 24%),#00afca}
.pr.kzr{width:20cqw}
.de-seal{display:flex;flex-direction:column;gap:.8cqw;margin-inline:.6cqw}
.de-seal i{width:6.2cqw;height:6.2cqw;border-radius:50%;background:radial-gradient(circle,#e8e8e8 0 45%,#2f6ad6 47% 62%,#d9d9d9 64%);box-shadow:0 0 0 .2cqw #999}
.de-seal i+i{background:radial-gradient(circle,#ffd200 0 35%,#d01c1c 37% 60%,#cfcfcf 62%)}
/* \421 \428 \410 : \448 \442 \430 \442  \441 \432 \435 \440 \445 \443  */
.plate.us .pb{flex-direction:column;border-radius:5cqw;border-width:1.4cqw;box-shadow:inset 0 0 0 1.2cqw var(--usb,#fff),0 1.4cqw 3cqw rgba(0,0,0,.25);background:var(--usbg,#fff)}
.us-st{text-align:center;font:italic 700 12cqw/1 var(--f-plate);color:var(--usc,#c8102e);padding-top:6cqw;letter-spacing:.02em;position:relative;z-index:2}
.plate.us .pm{font-size:25cqw;padding:0;color:var(--usc2,#1b2a6b);gap:2.4cqw;letter-spacing:0}
.us-ft{text-align:center;font:600 5cqw/1 var(--f-plate);color:var(--usc,#c8102e);z-index:2;letter-spacing:.12em;padding-bottom:4.5cqw;position:relative}
/* \414 \443 \431 \430 \439  */
.ae-l{width:21cqw;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6cqw;border-right:.6cqw solid #111;position:relative;z-index:2}
.ae-l .ar{font:700 7cqw/1 Tahoma,Arial,sans-serif;color:#c8102e}
.ae-l .en{font:800 5cqw/1 var(--f-plate);letter-spacing:.14em;color:#c8102e}
.ae-code{font-size:18cqw;margin-right:2.5cqw;color:#c8102e}
/* \43e \441 \43e \431 \44b \439  */
.sp-star{color:#c8102e;font-size:12cqw;line-height:1}
/* \442 \43e \43b \449 \438 \43d \430  \448 \440 \438 \444 \442 \430  */
.w0{--pw:400}.w1{--pw:500}.w2{--pw:700}.w3{--pw:900}
.w3 .pm{-webkit-text-stroke:.35cqw currentColor}
/* \43c \430 \442 \435 \440 \438 \430 \43b \44b  */
.pb::before,.pb::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:3}
.m1 .pb::after{background:var(--glit);mix-blend-mode:screen;opacity:.95;animation:twinkle 2.6s ease-in-out infinite alternate}
@keyframes twinkle{0%{opacity:.55;filter:hue-rotate(0)}100%{opacity:1;filter:hue-rotate(40deg)}}
.m2 .pb{background:linear-gradient(var(--pa,120deg),#f6f6ff,#fff)}
.m2 .pb::after{background:linear-gradient(var(--pa,120deg),hsl(var(--ph),95%,62%) 0%,hsl(calc(var(--ph) + 60),95%,62%) 18%,hsl(calc(var(--ph) + 120),95%,62%) 36%,hsl(calc(var(--ph) + 180),95%,62%) 54%,hsl(calc(var(--ph) + 240),95%,62%) 72%,hsl(calc(var(--ph) + 300),95%,62%) 90%,hsl(var(--ph),95%,62%) 100%);background-size:260% 260%;background-position:var(--hx,30%) var(--hy,50%);mix-blend-mode:multiply;opacity:.55;transition:background-position .2s}
.m3 .pb{background:repeating-linear-gradient(90deg,rgba(255,255,255,.18) 0 .3cqw,rgba(0,0,0,.05) .3cqw .7cqw),linear-gradient(var(--pa,160deg),#9aa3ad,#eef1f4 35%,#aab2bb 55%,#e2e6ea 80%,#8d959f);color:#1d232b;border-color:#3b434c}
.m3 .pm,.m3 .rn{text-shadow:0 .25cqw 0 rgba(255,255,255,.7),0 -.2cqw 0 rgba(0,0,0,.35)}
.m3 .pb::after{background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.7) 48%,transparent 60%);background-size:250% 100%;background-position:var(--hx,120%) 0;mix-blend-mode:overlay}
.m4 .pb{background:linear-gradient(var(--pa,135deg),#8a5a00,#d9a520 18%,#fff1a6 34%,#e3b02a 50%,#9c6b00 70%,#f7d56a 88%,#a87400);color:#3a2400;border-color:#5b3d00;box-shadow:inset 0 0 0 .55cqw rgba(255,240,180,.7),0 .8cqw 2.4cqw rgba(160,110,0,.45)}
.m4 .pm,.m4 .rn{text-shadow:0 .3cqw 0 rgba(255,236,160,.8),0 -.25cqw 0 rgba(80,50,0,.5)}
.m4 .pb::after{background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.85) 46%,transparent 58%);background-size:250% 100%;background-position:var(--hx,130%) 0;mix-blend-mode:soft-light;animation:sheen 3.4s ease-in-out infinite}
@keyframes sheen{0%,60%{background-position:150% 0}100%{background-position:-50% 0}}
.m4 .ps{filter:saturate(.6) sepia(.4)}
/* \438 \437 \43d \43e \441  */
.pb::before{background-image:var(--wtex);background-size:var(--wsz,140%) auto;background-position:var(--wpx,0) var(--wpy,0);opacity:var(--wear,0);mix-blend-mode:multiply;z-index:4}
.mat{background:var(--card2);border-radius:var(--r-sm);padding:10px;display:grid;place-items:center}
:root[data-theme="light"] .mat{background:#e9e9ee}

/* ================= \440 \443 \43b \435 \442 \43a \430  ================= */
.reel{position:relative;height:108px;border-radius:var(--r-lg);background:var(--card);overflow:hidden;margin:0 var(--g)}
.reel .strip{position:absolute;left:0;top:0;bottom:0;display:flex;align-items:center;gap:10px;padding:0 10px;will-change:transform}
.reel .ri{width:196px;flex:none;height:84px;border-radius:16px;display:grid;place-items:center;padding:0 12px 6px;background:var(--card2);position:relative}
.reel .ri::after{content:"";position:absolute;left:12px;right:12px;bottom:6px;height:3px;border-radius:3px;background:var(--mc,#8e8e93);opacity:.9}
:root[data-theme="light"] .reel .ri{background:#ececf1}
.reel .mark{position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:var(--accent);border-radius:3px;z-index:3;box-shadow:0 0 12px rgba(255,138,0,.7)}
.reel .mark::before,.reel .mark::after{content:"";position:absolute;left:50%;margin-left:-8px;border:8px solid transparent}
.reel .mark::before{top:-2px;border-top-color:var(--accent)}
.reel .mark::after{bottom:-2px;border-bottom-color:var(--accent)}
.reel .fade{position:absolute;top:0;bottom:0;width:70px;z-index:2;pointer-events:none}
.reel .fade.l{left:0;background:linear-gradient(90deg,var(--card),transparent)}
.reel .fade.r{right:0;background:linear-gradient(270deg,var(--card),transparent)}
.opener{margin:12px var(--g) 0;display:grid;gap:10px}
.opener .acts{display:grid;grid-template-columns:1.35fr 1fr;gap:10px}
.opener .btn{height:54px}
.opener .btn small{font:500 14px var(--f-ui);opacity:.85}

/* \432 \44b \43f \430 \432 \448 \438 \439  \43d \43e \43c \435 \440  */
.drop{margin:14px var(--g) 0;border-radius:var(--r-lg);padding:16px;background:var(--card);position:relative;overflow:hidden}
.drop::before{content:"";position:absolute;inset:-40% -20% auto;height:120%;background:radial-gradient(closest-side,var(--mc),transparent);opacity:.28;pointer-events:none}
.drop .head{display:flex;align-items:center;gap:8px;margin-bottom:12px;position:relative}
.drop .price{font:700 30px/1 var(--f-ui);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.drop .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.drop .acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.matb{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font:600 13px/1 var(--f-ui);background:color-mix(in srgb,var(--mc) 22%,transparent);color:var(--mc)}
.matb::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--mc)}
:root[data-theme="light"] .matb{color:color-mix(in srgb,var(--mc) 70%,#000)}
.popin{animation:popin .55s cubic-bezier(.2,1.4,.4,1)}
@keyframes popin{0%{transform:scale(.85);opacity:0}100%{transform:none;opacity:1}}

/* ================= \441 \442 \440 \430 \43d \438 \446 \44b -\441 \442 \435 \43a  \438  \448 \442 \43e \440 \43a \438  ================= */
#stack{position:fixed;inset:0;z-index:30;pointer-events:none}
.page{position:absolute;inset:0;background:var(--bg);overflow-y:auto;overflow-x:hidden;pointer-events:auto;transform:translateX(100%);transition:transform .38s cubic-bezier(.32,.72,0,1);-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.page.in{transform:none}
.page.under{transform:translateX(-24%)}
.page .inner{max-width:560px;margin:0 auto;padding:calc(var(--safe-t) + 8px) 0 calc(var(--tabh) + var(--safe-b) + 40px)}
.nav{display:flex;align-items:center;gap:10px;padding:4px 12px 14px;margin-bottom:-10px;position:sticky;top:calc(-1 * var(--safe-t) - 8px);padding-top:calc(var(--safe-t) + 12px);margin-top:calc(-1 * var(--safe-t) - 8px);z-index:5;background:linear-gradient(to bottom,var(--bg) 0,var(--bg) 62%,transparent)}
.back{height:40px;min-width:40px;border-radius:999px;display:inline-flex;align-items:center;gap:2px;padding:0 12px 0 8px;font:500 16px var(--f-ui)}
.back .ic{width:20px;height:20px}
.page h1{margin:6px var(--g) 4px;font:700 32px/1.12 var(--f-ui);letter-spacing:-.02em}
.page .lead{margin:0 var(--g) 14px;color:var(--text2);font-size:15px}
#sheets{position:fixed;inset:0;z-index:60;pointer-events:none}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.45);opacity:0;transition:opacity .3s;pointer-events:auto}
.scrim.in{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow-y:auto;background:var(--elev);border-radius:28px 28px 0 0;transform:translateY(100%);transition:transform .42s cubic-bezier(.32,.72,0,1);pointer-events:auto;padding:8px 0 calc(var(--safe-b) + 22px);max-width:560px;margin:0 auto;overscroll-behavior:contain}
:root:not([data-theme="light"]) .sheet{background:#1c1c1e}
.sheet.in{transform:none}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:var(--text3);margin:2px auto 10px}
.sheet h2{margin:4px var(--g) 6px;font:700 24px/1.2 var(--f-ui);letter-spacing:-.01em}
.sheet .lead{margin:0 var(--g) 14px;color:var(--text2);font-size:15px}
.sheet .x{position:absolute;right:14px;top:14px}
.sheet .foot{display:grid;gap:10px;padding:16px var(--g) 0}

/* \442 \43e \441 \442 \44b  \43a \430 \43a  \ab \43e \441 \442 \440 \43e \432 \bb  */
#toasts{position:fixed;z-index:90;left:0;right:0;top:calc(var(--safe-t) + 8px);display:grid;justify-items:center;gap:8px;pointer-events:none}
.toast{max-width:calc(100% - 32px);padding:12px 18px;border-radius:24px;font:500 15px/1.3 var(--f-ui);background:var(--glass-strong);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);box-shadow:var(--glass-sh);border:.5px solid var(--glass-b);animation:tin .45s cubic-bezier(.2,1.3,.4,1);pointer-events:none;text-align:center}
.toast.err{color:var(--red)}
.toast.out{animation:tout .3s forwards}
@keyframes tin{from{transform:translateY(-30px) scale(.9);opacity:0}}
@keyframes tout{to{transform:translateY(-20px) scale(.95);opacity:0}}

/* \43f \43e \43b \44f  */
.field{display:grid;gap:6px;margin:0 var(--g) 12px}
.field label{font:500 13px var(--f-ui);color:var(--text2);margin-left:4px}
.inp{width:100%;height:48px;border-radius:14px;border:0;background:var(--fill2);padding:0 14px;font-size:17px;outline:none}
.inp:focus{box-shadow:0 0 0 2px var(--blue)}
textarea.inp{height:auto;min-height:84px;padding:11px 14px;resize:vertical;line-height:22px}
select.inp{appearance:none;-webkit-appearance:none}
.rowf{display:flex;gap:8px}
.rowf>*{flex:1}

/* ================= \440 \430 \437 \434 \435 \43b \44b  ================= */
.hero{margin:0 var(--g);border-radius:var(--r-xl);overflow:hidden;position:relative;color:#fff;padding:22px 18px 18px;min-height:210px;display:flex;flex-direction:column;justify-content:flex-end;isolation:isolate}
.hero h3{margin:0;font:700 26px/1.15 var(--f-ui);letter-spacing:-.02em;max-width:85%}
.hero p{margin:6px 0 0;color:var(--tint,rgba(255,255,255,.75));font-size:15px;max-width:90%}
.hero .acts{margin-top:16px;display:flex;gap:8px;flex-wrap:wrap}
.hero canvas,.hero .art{position:absolute;inset:0;z-index:-1;width:100%;height:100%}
.feature{width:min(86vw,470px);border-radius:var(--r-lg);overflow:hidden;background:var(--card);color:#fff;position:relative;transition:transform .15s}
.feature:active{transform:scale(.985)}
.feature .pic{height:210px;position:relative;isolation:isolate;display:block;width:100%}
.feature .pic canvas{position:absolute;inset:0;width:100%;height:100%}
.feature .lbl{position:absolute;left:12px;top:12px;z-index:2}
.feature .info{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--fb,rgba(30,30,30,.92));min-height:74px}
.feature .info .mid{flex:1;min-width:0}
.feature .info .tt{font:600 17px/1.2 var(--f-ui)}
.feature .info .ss{font:400 14px/1.25 var(--f-ui);color:var(--tint,rgba(255,255,255,.7));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feature .info .gi{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;flex:none}
.feature .info .gi .ic{width:26px;height:26px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 var(--g)}
.tile{height:112px;border-radius:var(--r-md);padding:12px 14px;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;background:var(--gc);position:relative;overflow:hidden;text-align:left;transition:transform .15s;isolation:isolate}
.tile:active{transform:scale(.97)}
.tile .t{font:600 17px/1.18 var(--f-ui)}
.tile .s{font:500 12px/1.2 var(--f-ui);color:var(--tint)}
.tile .art{position:absolute;right:10px;top:10px;width:58px;height:58px;z-index:-1;opacity:.95}
.tile .art .ic{width:100%;height:100%}

/* \43f \440 \43e \43f \443 \441 \43a  */
.pass{display:flex;gap:10px;overflow-x:auto;padding:0 var(--g) 6px;scrollbar-width:none;scroll-snap-type:x proximity}
.pass::-webkit-scrollbar{display:none}
.pcol{width:96px;flex:none;display:grid;gap:8px;scroll-snap-align:center}
.pcol .n{text-align:center;font:700 15px var(--f-ui);color:var(--text2)}
.pcol.cur .n{color:var(--accent)}
.rw{height:104px;border-radius:16px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 6px;text-align:center;position:relative;transition:transform .12s}
.rw:active{transform:scale(.96)}
.rw .ic{width:30px;height:30px}
.rw b{font:700 13px/1.15 var(--f-ui)}
.rw small{font:500 11px/1.15 var(--f-ui);color:var(--text2)}
.rw.prem{background:linear-gradient(180deg,rgba(166,77,255,.28),rgba(122,47,224,.14))}
.rw.ready{box-shadow:inset 0 0 0 2px var(--accent)}
.rw.ready::after{content:"";position:absolute;top:7px;right:7px;width:9px;height:9px;border-radius:50%;background:var(--accent)}
.rw.got{opacity:.42}
.rw.lock .lk{position:absolute;top:6px;right:6px;width:16px;height:16px;color:var(--text2)}
.rw .plate{width:84px}
.ring{width:44px;height:44px;flex:none}

/* \43f \440 \43e \444 \438 \43b \44c  */
.prof{display:grid;justify-items:center;text-align:center;gap:6px;padding:8px var(--g) 0}
.prof .nick{font:700 26px/1.15 var(--f-ui);letter-spacing:-.01em;margin-top:6px}
.prof .bdg{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 var(--g)}
.stat{background:var(--card);border-radius:var(--r-md);padding:12px;text-align:center}
.stat b{display:block;font:700 19px/1.1 var(--f-ui);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat span{font:500 12px var(--f-ui);color:var(--text2)}
.cmt{display:flex;gap:10px;padding:12px 14px;align-items:flex-start}
.cmt+.cmt{border-top:.5px solid var(--sep)}
.cmt .body{flex:1;min-width:0}
.cmt .who{font:600 15px var(--f-ui)}
.cmt .who small{font:400 13px var(--f-ui);color:var(--text2);margin-left:6px}
.cmt p{margin:2px 0 0;font-size:15px;line-height:1.35;word-wrap:break-word}
.cmt .ops{display:flex;gap:12px;margin-top:6px}
.cmt .ops button{font:500 13px var(--f-ui);color:var(--text2)}
.friends{display:flex;justify-content:center;align-items:center;margin:6px 0 10px;height:96px;position:relative}
.friends .f{position:absolute;border-radius:50%;display:grid;place-items:center;font:700 18px var(--f-ui);color:#fff;box-shadow:0 0 0 3px var(--card)}

/* \433 \430 \440 \430 \436  */
.garage-view{position:relative;height:220px;margin:0 var(--g);border-radius:var(--r-xl);overflow:hidden;background:radial-gradient(120% 80% at 50% 100%,#3a3f47,#15171b 70%)}
:root[data-theme="light"] .garage-view{background:radial-gradient(120% 80% at 50% 100%,#ffffff,#dfe3ea 70%)}
.garage-view canvas{position:absolute;inset:0;width:100%;height:100%}
.swatches{display:flex;flex-wrap:wrap;gap:10px;padding:0 var(--g)}
.sw{width:44px;height:44px;border-radius:50%;position:relative;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18),0 2px 6px rgba(0,0,0,.25);transition:transform .12s}
.sw:active{transform:scale(.9)}
.sw.on{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--text)}
.sw .lk{position:absolute;right:-4px;bottom:-4px;height:18px;padding:0 5px;border-radius:9px;background:var(--card3);font:700 10px/18px var(--f-ui);color:var(--gold)}
.opts{display:flex;gap:8px;overflow-x:auto;padding:0 var(--g);scrollbar-width:none}
.opts::-webkit-scrollbar{display:none}
.opt{flex:none;min-width:96px;padding:10px 12px;border-radius:16px;background:var(--card);text-align:center;font:600 14px/1.2 var(--f-ui);display:grid;gap:4px;justify-items:center;position:relative}
.opt.on{box-shadow:inset 0 0 0 2px var(--accent)}
.opt small{font:500 12px var(--f-ui);color:var(--text2)}
.opt canvas{width:84px;height:46px}
.opt .rar{position:absolute;left:10px;right:10px;top:6px;height:3px;border-radius:3px}

/* \438 \43d \441 \43f \435 \43a \446 \438 \44f  2.5D */
.inspect{perspective:900px;padding:26px var(--g) 18px;display:grid;place-items:center;touch-action:none}
.inspect .tilt{width:100%;transform-style:preserve-3d;transition:transform .12s ease-out;will-change:transform}
.inspect .tilt .plate{filter:drop-shadow(0 22px 26px rgba(0,0,0,.45))}
.inspect .tilt .plate.us{width:62%}
.flt{position:relative;height:10px;border-radius:5px;background:linear-gradient(90deg,#30d158 0 7%,#a3e635 7% 15%,#ffd60a 15% 38%,#ff9f0a 38% 45%,#ff453a 45% 100%);margin:8px 0 4px}
.flt i{position:absolute;top:-5px;width:3px;height:20px;border-radius:2px;background:var(--text);margin-left:-1.5px;box-shadow:0 0 0 2px var(--bg)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:15px}
.kv dt{color:var(--text2)}.kv dd{margin:0;text-align:right;font-weight:600;white-space:nowrap}

/* \43c \438 \43d \438 -\438 \433 \440 \44b  */
#game{position:fixed;inset:0;z-index:80;background:#000;display:none;touch-action:none;user-select:none;-webkit-user-select:none}
#game.on{display:block}
#game canvas{position:absolute;inset:0;width:100%;height:100%}
.hud{position:absolute;left:0;right:0;top:calc(var(--safe-t) + 8px);display:flex;align-items:flex-start;gap:8px;padding:0 12px;z-index:3;pointer-events:none}
.hud .glass{border-radius:999px;padding:8px 14px;color:var(--text);font:600 15px/1.1 var(--f-ui);font-variant-numeric:tabular-nums;pointer-events:auto}
.hud .sc{font:800 30px/1 var(--f-ui);letter-spacing:-.02em;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.5)}
.hud .grow{flex:1}
.fuel{width:110px;height:10px;border-radius:5px;background:rgba(255,255,255,.25);overflow:hidden;margin-top:6px}
.fuel i{display:block;height:100%;background:linear-gradient(90deg,#ff453a,#ffd60a 40%,#30d158);transition:width .2s}
.pedals{position:absolute;left:0;right:0;bottom:calc(var(--safe-b) + 16px);display:flex;justify-content:space-between;padding:0 16px;z-index:3}
.pedal{width:118px;height:118px;border-radius:50%;display:grid;place-items:center;font:700 16px var(--f-ui);color:#fff;transition:transform .08s,background .08s;touch-action:none}
.pedal.on{transform:scale(.92);background:rgba(255,255,255,.32)}
.pedal .ic{width:34px;height:34px}
.gpop{position:absolute;left:0;right:0;top:32%;text-align:center;color:#fff;font:800 34px/1.1 var(--f-ui);text-shadow:0 4px 18px rgba(0,0,0,.55);z-index:3;pointer-events:none;opacity:0;transform:scale(.8);transition:opacity .2s,transform .3s cubic-bezier(.2,1.4,.4,1)}
